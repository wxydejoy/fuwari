      /* 从博客返回时:以博客当时的背景色/渐变作为首屏遮罩,再渐隐到深色落地页。
         遮罩在 head 同步放(首帧前),保证无 VT 环境零闪烁;跨文档 View Transition
         是否激活要等首帧前的 pagereveal 才见分晓——若 e.viewTransition 非空,
         说明原生过渡已接管,此时遮罩还未绘制过,直接撤掉即可,两层动画不会叠加。
         标记由博客端 Layout.astro 的 setupLandingTransition 写入。 */
      (function () {
        var style = null;
        var revealTimer = 0;
        var teardown = function () {
          if (revealTimer) { clearTimeout(revealTimer); revealTimer = 0; }
          if (style) { style.remove(); style = null; }
          document.documentElement.classList.remove("blog-arriving", "blog-reveal");
        };
        try {
          /* 只有博客来路才整屏遮罩(明→暗切换):先纯黑,再 600ms 渐开。
             主站落地页来路不放假遮罩:两页导航一致、同为纯黑底,
             子页自己的 dk-load/dk-reveal 入场就是"导航不动、只过渡正文"。
             landing-transition 是写给博客的标记,这里只消费不使用。 */
          var bt = JSON.parse(sessionStorage.getItem("blog-transition") || "null");
          sessionStorage.removeItem("blog-transition");
          sessionStorage.removeItem("landing-transition");
          if (
            bt && Date.now() - bt.t <= 3000 &&
            !window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ) {
            style = document.createElement("style");
            style.textContent =
              "html.blog-arriving::after{content:'';position:fixed;inset:0;z-index:99999;pointer-events:none;" +
              "opacity:1;transition:opacity 600ms ease;background:#000}" +
              "html.blog-arriving.blog-reveal::after{opacity:0}";
            document.head.appendChild(style);
            document.documentElement.classList.add("blog-arriving");

            var reveal = function () {
              requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                  if (!style) return;
                  document.documentElement.classList.add("blog-reveal");
                });
              });
              revealTimer = setTimeout(teardown, 1000);
            };
            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", reveal);
            } else {
              reveal();
            }
          }
        } catch (e) { /* 忽略 sessionStorage 异常 */ }
        window.addEventListener("pagereveal", function (e) {
          if (e.viewTransition) {
            document.documentElement.classList.add("vt-taken");
            if (style) teardown();
          }
        });
      })();

  (function () {
    var box = document.getElementById("sk-lightbox");
    if (!box) return;
    var img = box.querySelector("img");
    var caption = box.querySelector(".sk-lightbox-caption");
    var triggers = Array.prototype.slice.call(document.querySelectorAll("[data-lb]"));
    var current = -1;

    function visible(list) {
      return list.filter(function (t) { return t.offsetWidth > 0; });
    }

    function open(trigger) {
      var list = visible(triggers);
      current = list.indexOf(trigger);
      show(trigger.getAttribute("data-lb"), trigger.getAttribute("data-lb-caption"));
      box.classList.add("open");
    }

    function show(src, text) {
      img.src = src;
      img.alt = text || "";
      caption.textContent = text || "";
    }

    function step(dir) {
      var list = visible(triggers);
      if (!list.length) return;
      current = (current + dir + list.length) % list.length;
      var t = list[current];
      show(t.getAttribute("data-lb"), t.getAttribute("data-lb-caption"));
    }

    function close() {
      box.classList.remove("open");
      img.src = "";
    }

    triggers.forEach(function (t) {
      t.addEventListener("click", function () { open(t); });
    });
    box.querySelector(".sk-lightbox-close").addEventListener("click", close);
    box.querySelector(".sk-lightbox-prev").addEventListener("click", function () { step(-1); });
    box.querySelector(".sk-lightbox-next").addEventListener("click", function () { step(1); });
    box.addEventListener("click", function (e) {
      if (e.target === box) close();
    });
    document.addEventListener("keydown", function (e) {
      if (!box.classList.contains("open")) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowRight") step(1);
    });
  })();
